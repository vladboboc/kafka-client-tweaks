# distributionType=only-script: the wrapper is the two mvnw scripts plus this file, and nothing else - there is
# no maven-wrapper.jar in the repo. mvnw downloads the distribution named below on first use and caches it under
# ~/.m2/wrapper/dists, which is why the project builds on a machine with no Maven installed.
# Regenerate (from a Maven that is NOT this wrapper, or it cannot replace its own files):
#   mvn org.apache.maven.plugins:maven-wrapper-plugin:3.3.4:wrapper -Dtype=only-script -Dmaven=3.9.16
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
