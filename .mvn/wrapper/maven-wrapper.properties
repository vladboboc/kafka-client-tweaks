# distributionType=only-script means the wrapper needs no maven-wrapper.jar:
# the mvnw script downloads and caches the Maven distribution itself.
# This is why the project builds on a machine with no Maven installed.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
